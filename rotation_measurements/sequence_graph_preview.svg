<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <rect width="1400" height="700" fill="white"/>
  <style>
    text { font-family: 'Noto Sans CJK JP', sans-serif; fill: #222; }
    .axis { stroke: #333; stroke-width: 2; }
    .grid { stroke: #bbb; stroke-width: 1; opacity: .55; }
    .tick { font-size: 16px; }
    .label { font-size: 18px; font-weight: bold; }
    .small { font-size: 15px; }
  </style>
  <text x="700" y="40" text-anchor="middle" font-size="25" font-weight="bold">シーケンス切替を重ねた把持力グラフ（表示イメージ）</text>
  <!-- Phase backgrounds -->
  <rect x="105" y="85" width="260" height="390" fill="#D9EAF7"/>
  <rect x="365" y="85" width="290" height="390" fill="#FCE4D6"/>
  <rect x="655" y="85" width="90" height="390" fill="#E2F0D9"/>
  <rect x="745" y="85" width="505" height="390" fill="#E4DFEC"/>
  <!-- grid and axes -->
  <g class="grid">
    <line x1="105" y1="475" x2="1250" y2="475"/><line x1="105" y1="395" x2="1250" y2="395"/>
    <line x1="105" y1="315" x2="1250" y2="315"/><line x1="105" y1="235" x2="1250" y2="235"/>
    <line x1="105" y1="155" x2="1250" y2="155"/><line x1="105" y1="85" x2="1250" y2="85"/>
  </g>
  <line class="axis" x1="105" y1="85" x2="105" y2="475"/><line class="axis" x1="105" y1="475" x2="1250" y2="475"/>
  <text class="label" transform="translate(35,340) rotate(-90)">法線力 [N]</text>
  <g class="tick" text-anchor="end"><text x="95" y="480">0</text><text x="95" y="400">5</text><text x="95" y="320">10</text><text x="95" y="240">15</text><text x="95" y="160">20</text><text x="95" y="90">25</text></g>
  <!-- thresholds -->
  <line x1="105" y1="203" x2="1250" y2="203" stroke="#548235" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="1260" y="208" class="small" fill="#548235">目標 17 N</text>
  <line x1="105" y1="347" x2="1250" y2="347" stroke="#C00000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="1260" y="352" class="small" fill="#C00000">下限 8 N</text>
  <!-- illustrative force trace -->
  <path d="M105,475 C150,474 210,476 260,474 S330,475 365,474 C385,380 400,170 420,218 S450,245 470,202 S500,185 525,213 S555,220 580,201 S620,208 655,203 C675,195 700,212 720,202 S735,205 745,203 C780,194 810,213 850,204 S910,198 950,208 S1010,201 1060,206 S1130,198 1180,204 S1220,202 1250,205" fill="none" stroke="#1F4E78" stroke-width="4"/>
  <!-- phase changes -->
  <g stroke="#C00000" stroke-width="2" stroke-dasharray="8,6"><line x1="365" y1="85" x2="365" y2="475"/><line x1="655" y1="85" x2="655" y2="475"/><line x1="745" y1="85" x2="745" y2="475"/></g>
  <g fill="#C00000" font-size="15"><text x="373" y="120">開始: 把持</text><text x="663" y="142">開始: 搬送準備</text><text x="753" y="164">開始: 搬送</text></g>
  <!-- timeline -->
  <text x="105" y="535" class="label">シーケンス</text>
  <rect x="105" y="550" width="260" height="50" fill="#D9EAF7" stroke="#666"/><rect x="365" y="550" width="290" height="50" fill="#FCE4D6" stroke="#666"/><rect x="655" y="550" width="90" height="50" fill="#E2F0D9" stroke="#666"/><rect x="745" y="550" width="505" height="50" fill="#E4DFEC" stroke="#666"/>
  <g class="small" text-anchor="middle"><text x="235" y="581">ロボット・物体生成</text><text x="510" y="581">把持</text><text x="700" y="572">搬送</text><text x="700" y="590">準備</text><text x="998" y="581">搬送（回転）</text></g>
  <g class="tick" text-anchor="middle"><text x="105" y="630">0</text><text x="185" y="630">5</text><text x="265" y="630">10</text><text x="345" y="630">15</text><text x="425" y="630">20</text><text x="505" y="630">25</text><text x="585" y="630">30</text><text x="665" y="630">35</text><text x="745" y="630">40</text><text x="825" y="630">45</text><text x="905" y="630">50</text><text x="985" y="630">55</text><text x="1065" y="630">60</text><text x="1145" y="630">65</text><text x="1225" y="630">70</text></g>
  <text x="677" y="675" text-anchor="middle" class="label">シミュレーション開始からの時刻 [s]</text>
</svg>
