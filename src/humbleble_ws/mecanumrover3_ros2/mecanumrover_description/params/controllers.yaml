# ノード名キーを /** ワイルドカードにして、controller_manager が
# root (/controller_manager, 単体) でも namespace 付き
# (/amir1/controller_manager, マルチロボット) でもマッチするようにする。
/**/controller_manager:
  ros__parameters:
    # シミュレーション物理ステップ (max_step_size=0.004 s = 250 Hz) に合わせる
    update_rate: 250
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # rover_twist_relay_ign.py が /mecanum_drive_controller/reference_unstamped に publish するため
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController


/**/joint_state_broadcaster:
  ros__parameters:
    # ミミックジョイントを含む全ジョイントを明示 (固定ジョイントを除く)
    joints:
      - front_left_joint
      - front_right_joint
      - back_left_joint
      - back_right_joint
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Gripper
      - left_inner_back_joint
      - right_outer_back_joint
      - left_outer_back_joint
      - right_inner_front_joint
      - left_inner_front_joint


/**/mecanum_drive_controller:
  ros__parameters:
    use_stamped_vel: false
    reference_timeout: 1.0

    front_left_wheel_command_joint_name: "front_left_joint"
    front_right_wheel_command_joint_name: "front_right_joint"
    rear_left_wheel_command_joint_name: "back_left_joint"
    rear_right_wheel_command_joint_name: "back_right_joint"

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.076
      sum_of_robot_center_projection_on_X_Y_axis: 0.24

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    # Disabled: the odom->base_footprint TF now comes from the ground-truth
    # OdometryPublisher plugin (mecanum3.gazebo). Wheel-encoder odometry slips during
    # in-place rotation (4 cylinder wheels scrub) and corrupted the SLAM map.
    enable_odom_tf: false
    publish_rate: 50.0
