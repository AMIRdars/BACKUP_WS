# Fx-first staging profile. See README/report for bounded four-axis friction trials.
# Fixed-grasp Fx trials use pitch=0.2, compliant contact, mass=0.5 kg.
# Friction trials also require the measured insertion/holding settings in README.
# Calibration certificate is intentionally unset. Original 8 kg is not validated.
/**/follower_controller:
  ros__parameters:
    use_sim_time: true
    mode: B
    axes_enabled:
    - true
    - false
    - false
    - false
    recenter_enabled: false
    control_rate_hz: 100.0
    bias_samples: 100
    cutoff_hz: 8.0
    max_age_s: 0.05
    max_skew_s: 0.02
    sensor_sign: 1.0
    sensor_header_frame: amir2/Joint_5/wrist_ft_sensor
    calibration_file: ''
    max_abs_wrench:
    - 50.0
    - 50.0
    - 100.0
    - 5.0
    - 5.0
    - 5.0
    deadband:
    - 0.2
    - 0.2
    - 0.2
    - 0.02
    soft_limit:
    - 20.0
    - 20.0
    - 20.0
    - 2.0
    admittance:
      mass:
      - 50.0
      - 50.0
      - 50.0
      - 20.0
      damping:
      - 1500.0
      - 1500.0
      - 1500.0
      - 400.0
      stiffness:
      - 20.0
      - 20.0
      - 20.0
      - 2.0
      max_velocity:
      - 0.03
      - 0.03
      - 0.02
      - 0.08
      max_offset:
      - 0.05
      - 0.05
      - 0.03
      - 0.1
