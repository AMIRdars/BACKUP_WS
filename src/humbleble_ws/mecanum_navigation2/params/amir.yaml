controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # failure_tolerance: 0.3
    failure_tolerance: 5.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
      # movement_time_allowance: 20.0
    goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # DWB for a NON-holonomic skid-steer base (wheels are cylinders, not mecanum rollers):
    # FORWARD + theta only. No lateral (Y) motion (cylinder wheels scrub/slip), and no
    # reverse — the LiDAR faces forward only, so backing up would drive blind. The robot
    # rotates in place to face the path, then drives forward (PathAlign/GoalAlign strengthened).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0        # forbid reverse: only drive forward (front-facing LiDAR)
      max_vel_x: 0.18
      min_vel_y: 0.0
      max_vel_y: 0.0        # no strafing for cylinder wheels
      max_vel_theta: 1.0    # was 0.5 → robot could barely rotate
      min_speed_xy: 0.0
      max_speed_xy: 0.18    # match max_vel_x (was 0.13, which throttled forward speed)
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 0.0        # no lateral accel
      acc_lim_theta: 3.2
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1         # no Y motion → sampling Y is wasted
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      # PathAlign/GoalAlign raised: strongly prefer trajectories whose heading follows the
      # path, so the robot turns to face its direction of travel instead of arcing/reversing.
      PathAlign.scale: 64.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 32.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 20.0
      GoalDist.scale: 24.0
      # GoalDist.scale: 10.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      # 10 Hz update: clears swept free space faster during rotation so odom-drift
      # phantoms don't linger and block FollowPath.
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # 3x3 window (was 5x5): with a front-only LiDAR, phantom obstacles created by
      # rotation slip fall behind the robot where they can't be raytrace-cleared; a smaller
      # rolling window lets them roll off quickly instead of blocking the local plan.
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.22, -0.22], [0.22, 0.22], [-0.22, 0.22], [-0.22, -0.22]]"
      track_unknown_space: false
      # back_scan source removed: the rear LRF is disabled in all gazebo launches
      # ("後部 LRF 無効化"), so /back_scan is never published.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # cost_scaling_factor: 2.58
        # cost_scaling_factor: 1.58
        cost_scaling_factor: 8.58
        inflation_radius: 0.4
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      # rolling_window: false
      width: 30
      height: 30
      resolution: 0.05
      footprint: "[[0.22, -0.22], [0.22, 0.22], [-0.22, 0.22], [-0.22, -0.22]]"
      track_unknown_space: false
      # obstacle_layer removed: with slam_toolbox the /map static_layer is the source of
      # truth. Marking raw /scan into the map frame here caused doubled/smeared walls during
      # in-place rotation (slip + map->odom TF lag projects pre/post-rotation scans separately).
      # Real-time obstacle avoidance is still handled by the local_costmap (odom frame).
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_subscribe_transient_local: True
        subscribe_to_updates: true
        map_topic: map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # cost_scaling_factor: 1.0
        # cost_scaling_factor: 2.0
        cost_scaling_factor: 8.0
        inflation_radius: 0.4
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    # expected_planner_frequency: 10.0
    expected_planner_frequency: 4.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # [x, y, theta] — y kept 0 (no strafing). x min 0.0: forbid reverse (forward-only,
    # front-facing LiDAR). theta both directions for in-place rotation to face the path.
    max_velocity: [0.18, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

robot_state_publisher:
  ros__parameters:
    use_sim_time: True
