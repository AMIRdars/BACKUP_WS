/**:
  ros__parameters:
    # Shared robot identities.
    robot1_namespace: amir1
    robot2_namespace: amir2

    # Cooperative coordinator.
    control_rate: 50.0
    position_kp: 0.35
    yaw_kp: 0.50
    heading_kp: 0.20
    max_linear_speed: 0.035
    max_angular_speed: 0.040
    max_linear_acceleration: 0.040
    max_angular_acceleration: 0.060
    odometry_timeout: 0.30
    position_tolerance: 0.02
    yaw_tolerance: 0.0349066
    require_attached: true
    # The physical payload pose remains an independent safety/evaluation
    # signal. Base-center formation feedback avoids reversing the effective
    # yaw plant created by the two opposed friction grasps.
    use_measured_payload_pose: false
    use_measured_payload_position: true
    measured_payload_position_weight: 1.0
    formation_alignment_kp: 0.0
    formation_alignment_max_fraction: 1.0
    formation_alignment_tolerance: 0.008
    formation_recovery_start: 0.0
    formation_recovery_stop: 0.0
    formation_recovery_speed: 0.0
    # Keep the base-centre separation captured at transport start. Equal and
    # opposite correction limits squeeze/release changes along the grasp axis.
    enable_formation_distance_control: true
    formation_distance_kp: 0.8
    formation_distance_max_correction_speed: 0.012
    formation_distance_tolerance: 0.005
    payload_pose_timeout: 0.30
    # REP-103 signs after applying the 45-degree anisotropic wheel friction.
    lateral_command_sign: 1.0
    angular_command_sign: 1.0

    # Stage-7 one-axis admittance. The launch file enables it only for the
    # obstacle slalom; ordinary friction-transport bringup remains disabled.
    enable_lateral_admittance: false
    admittance_mass: 3.0
    admittance_damping: 26.8
    admittance_stiffness: 60.0
    admittance_force_deadband: 3.0
    admittance_filter_time_constant: 0.18
    admittance_max_displacement: 0.012
    admittance_max_velocity: 0.004
    admittance_force_sign: 1.0
    admittance_sensor_timeout: 0.25

    # Friction grasp manager.
    auto_grasp: true
    auto_grasp_delay: 4.0
    controller_wait_timeout: 12.0
    open_position: -1.0
    # Keep the position controller below the 20 N per-finger ceiling.  The
    # force loop immediately backs off when the ceiling is detected.
    close_position: 0.261799
    # 1.3 N m produced about 22 N at the AMIR finger pads. 0.8 N m gives
    # approximately 14 N through the simulated gripper lever ratio.
    maximum_effort: 0.8
    # Reserve margin below the 20 N per-finger limit. The 14 N target leaves
    # room for the transient generated by straight-line acceleration.
    target_normal_force: 14.0
    # Accept the physically useful 8--20 N range while regulating toward
    # 14 N. This avoids compound-pad force ripple blocking grasp completion.
    force_tolerance: 6.0
    force_position_gain: 0.0001
    force_control_max_step: 0.002
    # 0.008 rad caused a single contact-search update to jump above 20 N.
    # 0.002 rad reaches the approximately 0.34 rad-away contact position in
    # about 17 s while keeping the first-contact increment small.
    contact_search_step: 0.002
    # After first contact, never return to the coarse search increment. This
    # avoids a no-contact / over-force limit cycle around the payload face.
    contact_reacquisition_step: 0.0002
    # A raw force above the hard ceiling bypasses the filter and opens at a
    # bounded rate so the per-finger load returns below 20 N promptly.
    overforce_release_max_step: 0.006
    force_control_interval: 0.10
    force_filter_alpha: 0.25
    # Include margin for controller start-up, contact search, and force
    # settling.  The old 30 s timeout was incompatible with a 0.001 rad step.
    closing_timeout: 45.0
    maximum_normal_force: 20.0
    holding_force_release_threshold: 18.0
    holding_max_release_offset: 0.002
    # After HOLDING, never open in response to a short dynamic force peak.
    # Preserve the verified contact position and close only to recover a weak
    # contact. Raw forces above 20 N remain visible in logs and Excel.
    prioritize_grasp_retention: true
    bias_sample_duration: 0.50
    open_duration: 2.0
    close_duration: 3.0
    contact_verification_timeout: 2.0
    lift_duration: 3.0
    lift_joint_2: 0.10
    lift_joint_3: -0.10
    minimum_contact_position: -0.90
    maximum_contact_position: 0.27
    maximum_gripper_mismatch: 0.05
    require_contact: false
    payload_contact_token: cooperative_payload
    # A grasp is not considered healthy below 8 N on any finger. With the
    # 0.5 kg payload and configured contact friction this retains large margin.
    minimum_normal_force: 8.0
    contact_timeout: 0.25
    contact_stability_duration: 0.30
    # Allow closed-loop re-contact after the temporary support is removed.
    contact_loss_timeout: 2.0

    # Payload slip monitor.
    world_name: cooperative_transport_friction
    use_world_model_poses: true
    payload_name: cooperative_payload
    # Dynamic transform: world -> cooperative_transport_frame.
    # Its origin is the payload centre of mass; its axes rotate with payload.
    world_frame: world
    transport_frame: cooperative_transport_frame
    horizontal_slip_limit: 0.030
    vertical_slip_limit: 0.030
    yaw_slip_limit: 0.1396263
    activation_grace_period: 0.5

    # Two-robot safety monitor.
    monitor_rate: 50.0
    minimum_robot_separation: 2.30
    maximum_robot_separation: 3.10
    maximum_base_speed: 0.12
    joint_limit_margin: 0.0
    external_fault_topic: /cooperative_transport/slip_fault
    wrench_fault_topic: /cooperative_transport/wrench_fault

    # Dual wrist F/T monitor (stage 7, measurement and threshold stop).
    sensor_timeout: 0.25
    planar_force_warning: 30.0
    planar_force_stop: 50.0
    vertical_force_stop: 100.0
    torque_stop: 15.0
    fault_duration: 0.10
