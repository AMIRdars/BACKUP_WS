/leader/controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController
    update_rate: 250
    use_sim_time: true
/leader/joint_state_broadcaster:
  ros__parameters:
    joints:
    - front_left_joint
    - front_right_joint
    - back_left_joint
    - back_right_joint
    - Joint_1
    - Joint_2
    - Joint_3
    - Joint_4
    - Joint_5
    - Gripper
    - left_inner_back_joint
    - right_outer_back_joint
    - left_outer_back_joint
    - right_inner_front_joint
    - left_inner_front_joint
